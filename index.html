<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banao AI - Text to Video</title>
</head>
<body>

  <h1>🎬 Banao AI</h1>
  <p>Text se AI Video banaye</p>

  <textarea id="story" placeholder="Apni story yahan likho..." rows="8"></textarea>

  <br><br>

  <button onclick="generateVideo()">Generate Video</button>

  <p id="status"></p>

  <script>
    function generateVideo() {
      const story = document.getElementById("story").value;

      if (story.trim() === "") {
        alert("Pehle apni story likho!");
        return;
      }

      document.getElementById("status").innerText =
        "Story ready hai! AI video generation API baad mein connect karenge.";
    }
  </script>

</body>
</html>
